<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Molto Caldo — Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ink:#111111; --paper:#ffffff; --soft:#F4F1EC; --line:#E6E1D9; --muted:#8C867E;
    --bronze:#A47A4D; --bronze-2:#86603A; --bronze-soft:#F3EBE1;
    --serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 var(--sans)}
  /* на широком экране (компьютер) — узкая колонка, как в телефоне */
  body{max-width:520px;margin:0 auto}
  @media (min-width:560px){ html{background:#ECE8E2} body{min-height:100vh;box-shadow:0 0 0 1px var(--line)} }
  .pv,.sheet{max-width:520px;margin:0 auto}
  body.lock{overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}

  /* ---------- шапка ---------- */
  .top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:14px 12px 6px}
  .lang{justify-self:start;font-size:11px;letter-spacing:.14em;border:1px solid var(--line);padding:5px 8px}
  .brand{text-align:center}
  .wordmark{font-family:var(--serif);font-size:21px;letter-spacing:.34em;margin-right:-.34em;font-weight:400;white-space:nowrap}
  .rule{width:26px;height:1px;background:var(--bronze);margin:7px auto 0}
  .favbtn{justify-self:end;position:relative;padding:6px}
  .favbtn.on{color:var(--bronze)}
  .favbtn .cnt{position:absolute;top:0;right:-2px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;background:var(--ink);color:#fff;border-radius:8px;padding:0 4px}
  .search{margin:10px 14px 4px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);padding:8px 2px}
  .search input{flex:1;border:0;outline:0;font:inherit;background:transparent;color:var(--ink)}
  .search input::placeholder{color:var(--muted)}

  /* ---------- липкая панель: категории + фильтры ---------- */
  .sticky{position:sticky;top:0;z-index:5;background:var(--paper);padding-top:8px;border-bottom:1px solid var(--line)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);padding:7px 12px;font-size:13px;white-space:nowrap}
  .chip small{color:var(--muted);margin-left:4px;font-size:11px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on small{color:#CDAE88}
  .filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 14px 10px}
  .fb{border:1px solid var(--line);padding:7px 8px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
  .fb span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .fb em{font-style:normal;color:var(--bronze-2)}
  .fb svg.i{width:14px;height:14px;flex:none;color:var(--muted)}
  .fb.on{border-color:var(--bronze)}
  .countrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 2px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .countrow button{color:var(--bronze-2);font-size:12px;text-decoration:underline;text-underline-offset:3px}

  /* ---------- сетка товаров ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 10px;padding:12px 14px 8px}
  .card{cursor:pointer;min-width:0}
  .ph{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph svg.sil{height:76%;width:auto}
  .badge{position:absolute;top:8px;left:8px;background:var(--paper);color:var(--bronze-2);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:3px 6px}
  .sale{position:absolute;bottom:8px;left:8px;background:var(--ink);color:#fff;font-size:10px;letter-spacing:.08em;padding:3px 6px}
  .fav{position:absolute;top:4px;right:4px;padding:6px;color:var(--ink)}
  .fav.on{color:var(--bronze)} .fav.on svg.i{fill:var(--bronze)}
  .price{margin-top:9px;font-weight:600;font-size:14px;letter-spacing:.01em}
  .old{color:var(--muted);font-size:12px;text-decoration:line-through;font-weight:400}
  .title{font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .empty{padding:56px 24px;text-align:center;color:var(--muted)}
  .sentinel{height:1px}

  /* ---------- подвал ---------- */
  .foot{margin-top:28px;padding:22px 18px 34px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
  .foot h4{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:15px;letter-spacing:.06em;margin:0 0 6px}
  .foot a{color:var(--ink)}
  .foot .demo{display:inline-block;margin-top:8px;border:1px solid var(--bronze);color:var(--bronze-2);padding:2px 6px;font-size:10px;letter-spacing:.12em}

  /* ---------- карточка товара ---------- */
  .pv{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;transform:translateX(100vw);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;-webkit-overflow-scrolling:touch}
  .pv.show{transform:none;visibility:visible;transition:transform .22s ease}
  .pv-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:4px;padding:8px 8px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .pv-top .t{flex:1;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-left:4px}
  .pv-top button{padding:8px}
  .pv-top .fav-on{color:var(--bronze)} .pv-top .fav-on svg.i{fill:var(--bronze)}
  .pv-photo{position:relative;aspect-ratio:4/5;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pv-photo img{width:100%;height:100%;object-fit:cover}
  .pv-photo svg.sil{height:78%}
  .pv-body{padding:18px 18px 40px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .pv-title{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.02em;margin:6px 0 4px}
  .pv-price{font-size:18px;font-weight:600}
  .pv-price .old{font-size:14px;margin-left:8px}
  .sec{margin-top:22px}
  .sec-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .sec-h b{color:var(--ink);font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
  .swatches{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.18);position:relative}
  .sw.on::after{content:"";position:absolute;inset:-5px;border:1px solid var(--ink);border-radius:50%}
  .sizes{display:flex;gap:8px;flex-wrap:wrap}
  .sz{min-width:50px;height:42px;border:1px solid var(--line);font-size:14px}
  .sz.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .sz:disabled{color:#C9C3BA;background:repeating-linear-gradient(135deg,#fff 0 6px,#F7F5F1 6px 7px);cursor:default}
  .sizes.flash .sz:not(:disabled){animation:flash .7s ease 2}
  @keyframes flash{50%{border-color:var(--bronze);background:var(--bronze-soft)}}
  .avail{border-top:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .row .sn{font-size:14px}
  .row .sc{font-size:11.5px;color:var(--muted)}
  .row .st{font-size:13px;text-align:right}
  .row .st.ok{color:var(--ink)} .row .st.last{color:var(--bronze-2)} .row .st.no{color:#BDB6AD}
  .row.pref .sn::before{content:"";display:inline-block;width:6px;height:6px;background:var(--bronze);margin-right:7px;vertical-align:middle}
  .btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;height:50px;margin-top:10px;border:1px solid var(--ink);font-size:14px;letter-spacing:.06em}
  .btn.primary{background:var(--ink);color:#fff;margin-top:26px}
  .btn.primary:disabled{background:#BDB6AD;border-color:#BDB6AD}
  .btn.link{border:0;height:44px;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
  .note{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}

  /* ---------- нижняя шторка ---------- */
  .veil{position:fixed;inset:0;z-index:30;background:rgba(17,17,17,.42);opacity:0;pointer-events:none;transition:opacity .2s}
  .veil.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);max-height:82vh;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .24s ease}
  .sheet.show{transform:none}
  .handle{width:36px;height:3px;background:var(--line);margin:0 auto 14px}
  .sheet h3{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.03em;margin:0 0 14px}
  .sheet .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
  .opt{display:flex;width:100%;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
  .opt small{color:var(--muted)} .opt .r{display:flex;align-items:center;gap:10px}
  .opt.on{font-weight:600} .opt.on svg.i{color:var(--bronze)}
  .opt:disabled{color:#C9C3BA}
  .szgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .szgrid .opt2{border:1px solid var(--line);padding:10px 0;text-align:center}
  .szgrid .opt2 small{display:block;font-size:10.5px;color:var(--muted)}
  .szgrid .opt2.on{background:var(--ink);color:#fff;border-color:var(--ink)} .szgrid .opt2.on small{color:#CDAE88}
  .szgrid .opt2:disabled{color:#C9C3BA}
  .szgrid .opt2.wide{grid-column:span 4}
  .sum{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .sum .ph{width:64px;flex:none}
  .sum .x{font-size:13px;color:var(--muted)} .sum .y{font-size:15px;color:var(--ink)}
  .done{text-align:center;padding:10px 0 4px}
  .done .ok{width:54px;height:54px;border:1px solid var(--bronze);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto 14px;color:var(--bronze)}
  .done .ok svg.i{width:26px;height:26px}
  .done p{color:var(--muted);margin:6px 0 0}

  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .loading{padding:80px 0;text-align:center;color:var(--muted);letter-spacing:.2em;font-size:11px}
</style>
</head>
<body>
<header class="top">
  <button class="lang" id="langBtn">UZ</button>
  <div class="brand"><div class="wordmark">MOLTO CALDO</div><div class="rule"></div></div>

</div>

<section class="pv" id="pv"></section>
<div class="veil" id="veil"></div>

<div class="toast" id="toast"></div>

const S = { lang:'uz', cat:'all', size:null, store:null, price:'all', sort:'default', q:'', favOnly:false,
            list:[], shown:0, pid:null, pcolor:null, psize:null, rstore:null, entryDirect:false };
let ITEMS = [], BY_ID = {}, STORES = [], DATA = null, DEMO = false, FAVS = new Set();

const t = (k, ...a) => { const v = (I18N[S.lang] || I18N.uz)[k]; return typeof v === 'function' ? v(...a) : (v == null ? k : v); };
const L = o => (o && typeof o === 'object') ? (o[S.lang] || o.uz || Object.values(o)[0]) : (o || '');
const catOne = c => CATS[c] ? CATS[c].one[S.lang] : c;
const catChip = c => CATS[c] ? CATS[c].chip[S.lang] : c;

function fmtPrice(n){
  const s = Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, S.lang === 'en' ? ',' : ' ');
  return s + (S.lang === 'uz' ? " so'm" : S.lang === 'ru' ? ' сум' : ' UZS');
}
const inRange = (p, r) => (r.min == null || p >= r.min) && (r.max == null || p < r.max);

function lum(hex){ const n = parseInt(hex.slice(1), 16); return (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; }
function silhouette(it, color){
  const sh = SHAPES[(CATS[it.category] || {}).shape] || SHAPES.coat, hex = colorHex(color);
  const det = lum(hex) < 0.45 ? 'rgba(255,255,255,.28)' : 'rgba(0,0,0,.22)';
  return `<svg class="sil" viewBox="0 0 100 130" aria-hidden="true"><path d="${sh.d}" fill="${hex}" stroke="rgba(0,0,0,.25)" stroke-width=".7" stroke-linejoin="round"/><path d="${sh.x}" fill="none" stroke="${det}" stroke-width=".8" stroke-linecap="round"/></svg>`;
}

/* ---------- наличие ---------- */
function prep(it, idx){
  const sizes = new Set(), stores = new Set(); let total = 0;
  const colors = Object.keys(it.stock || {}).filter(c => {
    let any = false;
    for (const [sz, st] of Object.entries(it.stock[c])) for (const [sid, q] of Object.entries(st))
      if (q > 0) { sizes.add(+sz); stores.add(sid); total += q; any = true; }
    return any;
  });
  it._idx = idx; it._colors = colors; it._sizes = [...sizes].sort((a, b) => a - b); it._stores = stores; it._total = total;
  it._q = [it.id, it.name, it.category, CATS[it.category] ? Object.values(CATS[it.category].one).join(' ') : ''].join(' ').toLowerCase();
  return it;
}
function hasStock(it, size, sid, color){
  for (const c of it._colors) {
    if (color && c !== color) continue;
    for (const [sz, st] of Object.entries(it.stock[c])) {
      if (size != null && +sz !== size) continue;
      for (const [s, q] of Object.entries(st)) if (q > 0 && (sid == null || s === sid)) return true;
    }
  }
  return false;
}
function qty(it, color, size, sid){ return ((((it.stock || {})[color] || {})[String(size)] || {})[sid]) || 0; }

function passes(it, skip){
  if (skip !== 'cat' && S.cat !== 'all' && !(S.cat === '__new' ? it.new : it.category === S.cat)) return false;
  if (S.favOnly && !FAVS.has(it.id)) return false;
  if (S.q && !it._q.includes(S.q)) return false;
  if (skip !== 'price' && S.price !== 'all' && !inRange(it.price, PR[S.price])) return false;
  const sz = skip === 'size' ? null : S.size, st = skip === 'store' ? null : S.store;
  if ((sz != null || st != null) && !hasStock(it, sz, st)) return false;
  return true;
}
function sortList(l){
  if (S.sort === 'asc') return l.sort((a, b) => a.price - b.price || a._idx - b._idx);
  if (S.sort === 'desc') return l.sort((a, b) => b.price - a.price || a._idx - b._idx);
  return l.sort((a, b) => (b.new ? 1 : 0) - (a.new ? 1 : 0) || a._idx - b._idx);
}

/* ---------- избранное ---------- */
function toggleFav(id){
  if (FAVS.has(id)) FAVS.delete(id);
  else { if (FAVS.size >= CONFIG.FAV_LIMIT) FAVS.delete(FAVS.values().next().value); FAVS.add(id); }
  KV.set('favs', [...FAVS].join(','));
  haptic();
}

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =====================================================================
   События
   ===================================================================== */
function route(){
  const m = location.hash.match(/^#p=(.+)$/);
  if (m && BY_ID[decodeURIComponent(m[1])]) showProduct(decodeURIComponent(m[1])); else hideProduct();
}
function openProduct(id){ S.entryDirect = false; location.hash = 'p=' + encodeURIComponent(id); }
function closeProduct(){
  if (S.entryDirect || !history.state && history.length <= 1) {
    S.entryDirect = false; history.replaceState(null, '', location.pathname + location.search); route();
  } else history.back();
}

function bind(){
  $('#langBtn').onclick = () => { S.lang = { uz:'ru', ru:'en', en:'uz' }[S.lang]; KV.set('lang', S.lang); haptic(); renderAll(); };
  $('#favBtn').onclick = () => { S.favOnly = !S.favOnly; haptic(); renderChrome(); renderChips(); renderFilters(); renderGrid(); window.scrollTo(0, 0); };
  $('#resetBtn').onclick = () => { Object.assign(S, { cat:'all', size:null, store:null, price:'all', sort:'default', q:'', favOnly:false }); $('#q').value = ''; renderChrome(); renderChips(); renderFilters(); renderGrid(); };
  let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); renderChips(); renderFilters(); renderGrid(); }, 150); });

  $('#chips').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; S.cat = b.dataset.cat; haptic(); renderChips(); renderFilters(); renderGrid(); b.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' }); };
  $('#filters').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; haptic(); ({ size: sheetSize, price: sheetPrice, store: sheetStore })[b.dataset.f](); };

  $('#grid').onclick = e => {
    const f = e.target.closest('[data-fav]');
    if (f) { e.stopPropagation(); toggleFav(f.dataset.fav); f.classList.toggle('on', FAVS.has(f.dataset.fav)); renderChrome(); if (S.favOnly) { renderChips(); renderGrid(); } return; }
    const c = e.target.closest('.card'); if (c) { haptic(); openProduct(c.dataset.id); }
  };

  $('#veil').onclick = closeSheet;
  $('#sheet').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if ('size' in d)  { S.size = d.size === '' ? null : +d.size; closeSheet(); renderChips(); renderFilters(); renderGrid(); return; }
    if ('sort' in d)  { S.sort = d.sort; closeSheet(); renderFilters(); renderGrid(); return; }
    if ('price' in d) { S.price = d.price; closeSheet(); renderChips(); renderFilters(); renderGrid(); return; }
    if ('store' in d) { S.store = d.store || null; closeSheet(); renderChips(); renderFilters(); renderGrid(); return; }
    if ('rstore' in d){ S.rstore = d.rstore; haptic(); renderReserve(STORES.filter(s => qty(BY_ID[S.pid], S.pcolor, S.psize, s.id) > 0)); return; }
    if (d.act === 'confirm') { confirmReserve(b); return; }
    if (d.act === 'close') { closeSheet(); return; }
    if (d.act === 'phone') { try { tg.requestContact(ok => { if (ok) toast(t('thanks')); closeSheet(); }); } catch(err) { closeSheet(); } return; }
  };

  $('#pv').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if ('color' in d) { S.pcolor = d.color; if (S.psize != null && !hasStock(BY_ID[S.pid], S.psize, null, S.pcolor)) S.psize = null; haptic(); renderProduct(); return; }
    if ('psize' in d) { S.psize = S.psize === +d.psize ? null : +d.psize; haptic(); renderProduct(); return; }
    switch (d.act) {
      case 'back': closeProduct(); break;
      case 'fav': toggleFav(S.pid); renderProduct(); renderChrome(); { const g = document.querySelector(`.fav[data-fav="${CSS.escape(S.pid)}"]`); if (g) g.classList.toggle('on', FAVS.has(S.pid)); } break;
      case 'share': shareItem(); break;
      case 'ask': askManager(); break;
      case 'reserve': openReserve(); break;
    }
  };

  window.addEventListener('hashchange', route);
  if (IN_TG && can('6.1')) tg.BackButton.onClick(() => { if ($('#sheet').classList.contains('show')) closeSheet(); else closeProduct(); });
  new IntersectionObserver(es => { if (es[0].isIntersecting) more(); }, { rootMargin: '600px' }).observe($('#sentinel'));
}

/* =====================================================================
   Запуск
   ===================================================================== */
async function loadCatalog(){
  try {
    const r = await fetch(CONFIG.CATALOG_URL + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json(); DEMO = false;
  } catch(e) {
    DATA = JSON.parse($('#demo-data').textContent); DEMO = true;
  }
  STORES = DATA.stores || [];
  ITEMS = (DATA.items || []).map(prep).filter(it => it._total > 0);
  BY_ID = {}; ITEMS.forEach(it => BY_ID[it.id] = it);
}

function startLang(cb){
  KV.get('lang', saved => {
    if (saved && I18N[saved]) S.lang = saved;
    else {
      const lc = IN_TG && tg.initDataUnsafe && tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.language_code || '') : 'uz';
      S.lang = lc.startsWith('ru') ? 'ru' : lc.startsWith('en') ? 'en' : 'uz';
    }
    cb();
  });
}

async function init(){
  bind();
  await loadCatalog();
  await new Promise(r => startLang(r));
  await new Promise(r => KV.get('favs', v => { if (v) v.split(',').filter(Boolean).forEach(x => FAVS.add(x)); r(); }));
  renderAll();
  // прямая ссылка на модель: t.me/<бот>/<app>?startapp=p_<артикул>
  const sp = (IN_TG && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('tgWebAppStartParam') || '';
  if (sp.startsWith('p_') && BY_ID[decodeURIComponent(sp.slice(2))]) {
    S.entryDirect = true;
    history.replaceState(null, '', '#p=' + encodeURIComponent(decodeURIComponent(sp.slice(2))));
  }
  route();
}
init();
})();
</script>
